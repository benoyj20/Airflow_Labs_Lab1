# Overrides for this lab. Anything not set here uses Airflow's defaults.
# Settings in docker-compose.yaml (AIRFLOW__SECTION__KEY variables) take priority over this file.

[core]
parallelism = 16
max_active_tasks_per_dag = 8

[scheduler]
# pick up new or changed DAG files every 30s instead of every 5 min
dag_dir_list_interval = 30
min_file_process_interval = 30

[celery]
worker_concurrency = 8

[webserver]
instance_name = Airflow Lab 1 - Model Selection
default_ui_timezone = America/New_York
expose_config = True
